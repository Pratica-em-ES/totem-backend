# ========================================
# LOCAL PROFILE - H2 In-Memory Database
# ========================================
# Used for local development without external database

# Server Port
server.port=8080

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:totemdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# H2 Console (for debugging)
# Access at: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:totemdb
# Username: sa
# Password: (empty)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL Initialization (loads import.sql on startup)
spring.sql.init.mode=always

# Development Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Management Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always